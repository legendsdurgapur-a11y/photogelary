<header class="navbar-wrapper" [class.scrolled]="isScrolled">
  <div class="container navbar-inner">
    <!-- Brand / Logo -->
    <a href="#" class="brand" (click)="$event.preventDefault(); scrollTo('hero')">
      <div class="logo-icon-box">
        <svg class="aperture-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="10"/>
          <line x1="14.31" y1="8" x2="20.05" y2="17.94"/>
          <line x1="9.69" y1="8" x2="21.17" y2="8"/>
          <line x1="7.38" y1="12" x2="13.12" y2="2.06"/>
          <line x1="9.69" y1="16" x2="3.95" y2="6.06"/>
          <line x1="14.31" y1="16" x2="2.83" y2="16"/>
          <line x1="16.62" y1="12" x2="10.88" y2="21.94"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">LUMINA</span>
        <span class="brand-subtitle">FINE ART GALLERY</span>
      </div>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="nav-links">
      <a class="nav-link" (click)="scrollTo('gallery')">Exhibition</a>
      <a class="nav-link" (click)="scrollTo('albums')">Curated Series</a>
      <a class="nav-link" (click)="scrollTo('photographers')">Artists</a>
      <a class="nav-link" (click)="scrollTo('testimonials')">Patrons</a>
    </nav>

    <!-- Search Bar in Nav -->
    <div class="search-box">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input 
        type="text" 
        placeholder="Search camera, theme, artist..." 
        [ngModel]="searchQuery" 
        (ngModelChange)="onSearch($event)"
      />
      <button *ngIf="searchQuery" class="clear-search-btn" (click)="clearSearch()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Action Buttons -->
    <div class="nav-actions">
      <button class="btn btn-secondary btn-upload" (click)="openUpload.emit()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span>Submit Photo</span>
      </button>

      <button class="btn btn-primary btn-book" (click)="openBooking.emit()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span>Book Shoot</span>
      </button>

      <!-- Mobile Hamburger Toggle -->
      <button class="mobile-toggle" (click)="mobileMenuOpen = !mobileMenuOpen" [class.open]="mobileMenuOpen">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Menu -->
  <div class="mobile-menu" *ngIf="mobileMenuOpen">
    <div class="mobile-search">
      <input 
        type="text" 
        placeholder="Search photography..." 
        [ngModel]="searchQuery" 
        (ngModelChange)="onSearch($event)"
      />
    </div>
    <a (click)="scrollTo('gallery')">Exhibition</a>
    <a (click)="scrollTo('albums')">Curated Series</a>
    <a (click)="scrollTo('photographers')">Artists</a>
    <a (click)="scrollTo('testimonials')">Patrons</a>
    <div class="mobile-menu-buttons">
      <button class="btn btn-secondary w-full" (click)="openUpload.emit(); mobileMenuOpen = false">
        Submit Photo
      </button>
      <button class="btn btn-primary w-full" (click)="openBooking.emit(); mobileMenuOpen = false">
        Book Session
      </button>
    </div>
  </div>
</header>
